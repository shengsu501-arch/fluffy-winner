<!DOCTYPE html>
<html>
<head>
    <title>GitHub音乐播放器</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        
        .container {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }
        
        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
            margin-bottom: 30px;
        }
        
        .music-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 30px;
            margin: 25px 0;
        }
        
        .album-art {
            width: 200px;
            height: 200px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff0080, #ff8c00);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            animation: rotate 20s linear infinite;
            animation-play-state: paused;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        
        .album-art.playing {
            animation-play-state: running;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .status {
            font-size: 1.3em;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin: 20px 0;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        
        .status.ready {
            background: rgba(0, 255, 0, 0.2);
            border: 2px solid #00ff00;
        }
        
        .status.waiting {
            background: rgba(255, 165, 0, 0.2);
            border: 2px solid #ffa500;
        }
        
        .status.error {
            background: rgba(255, 0, 0, 0.2);
            border: 2px solid #ff0000;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 25px 0;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 160px;
            justify-content: center;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #00b09b, #96c93d);
            color: white;
            box-shadow: 0 5px 15px rgba(0, 176, 155, 0.4);
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 176, 155, 0.6);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .volume-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }
        
        input[type="range"] {
            width: 200px;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            outline: none;
            -webkit-appearance: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            background: #00ff88;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }
        
        .progress-container {
            margin: 25px 0;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
        }
        
        .progress {
            height: 100%;
            background: linear-gradient(90deg, #00b09b, #96c93d);
            width: 0%;
            border-radius: 4px;
            transition: width 0.1s;
        }
        
        .time-display {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 14px;
            opacity: 0.8;
        }
        
        .instructions {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 20px;
            margin-top: 25px;
            text-align: left;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .instructions h3 {
            color: #96c93d;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .instructions ul {
            padding-left: 20px;
        }
        
        .instructions li {
            margin: 8px 0;
        }
        
        .github-info {
            margin-top: 30px;
            font-size: 14px;
            opacity: 0.7;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .album-art {
                width: 150px;
                height: 150px;
                font-size: 45px;
            }
            
            .btn {
                min-width: 140px;
                padding: 12px 25px;
            }
            
            .controls {
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 GitHub音乐播放器</h1>
        <p class="subtitle">专为GitHub Pages优化的音乐播放</p>
        
        <div class="music-box">
            <div class="album-art" id="albumArt">🎵</div>
            
            <div class="status" id="status">
                正在初始化播放器...
            </div>
            
            <div class="progress-container">
                <div class="progress-bar" id="progressBar">
                    <div class="progress" id="progress"></div>
                </div>
                <div class="time-display">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>
            
            <div class="controls">
                <button class="btn btn-primary" onclick="togglePlay()" id="playBtn">
                    <span id="playIcon">▶️</span>
                    <span id="playText">播放音乐</span>
                </button>
                <button class="btn btn-secondary" onclick="restartMusic()">
                    🔄 重新开始
                </button>
            </div>
            
            <div class="volume-control">
                <span>🔊 音量:</span>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.7" 
                       oninput="updateVolume(this.value)">
                <span id="volumePercent">70%</span>
            </div>
        </div>
        
        <div class="instructions">
            <h3>GitHub Pages使用说明</h3>
            <ul>
                <li>🎯 <strong>必须点击一次页面</strong>才能启动音乐播放（浏览器安全限制）</li>
                <li>📱 支持手机和电脑访问</li>
                <li>🔄 音乐会自动循环播放</li>
                <li>🔊 可以随时调节音量</li>
                <li>⏯️ 点击播放/暂停按钮控制音乐</li>
                <li>💾 确保音乐文件已上传到GitHub仓库</li>
            </ul>
        </div>
        
        <div class="github-info">
            访问地址: https://shengsu501-arch.github.io/fluffy-winner/
        </div>
    </div>

    <!-- 重要：修改这里的文件名！ -->
    <audio id="musicPlayer" loop preload="auto">
        <source src="佐藤千亜妃 - 花曇り.mp3" type="audio/mpeg">
        <!-- 如果音乐文件不是test.mp3，请修改上面的文件名 -->
        <source src="music.mp3" type="audio/mpeg">
        <source src="audio.mp3" type="audio/mpeg">
        您的浏览器不支持音频播放。
    </audio>

    <script>
        // 获取DOM元素
        const music = document.getElementById('musicPlayer');
        const statusEl = document.getElementById('status');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const playText = document.getElementById('playText');
        const albumArt = document.getElementById('albumArt');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumePercent = document.getElementById('volumePercent');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const progressEl = document.getElementById('progress');
        const progressBar = document.getElementById('progressBar');
        
        // 初始化变量
        let isPlaying = false;
        let userInteracted = false;
        
        // 格式化时间（秒 -> 分:秒）
        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }
        
        // 更新播放进度
        function updateProgress() {
            if (music.duration) {
                const currentTime = music.currentTime;
                const duration = music.duration;
                const percent = (currentTime / duration) * 100;
                
                currentTimeEl.textContent = formatTime(currentTime);
                durationEl.textContent = formatTime(duration);
                progressEl.style.width = percent + '%';
            }
        }
        
        // 更新音量显示
        function updateVolume(value) {
            music.volume = parseFloat(value);
            volumePercent.textContent = Math.round(value * 100) + '%';
        }
        
        // 切换播放/暂停
        function togglePlay() {
            if (!userInteracted) {
                userInteracted = true;
                statusEl.textContent = "已检测到用户交互，正在播放音乐...";
                statusEl.className = "status ready";
            }
            
            if (music.paused) {
                music.play().then(() => {
                    isPlaying = true;
                    playIcon.textContent = "⏸️";
                    playText.textContent = "暂停音乐";
                    albumArt.classList.add('playing');
                    statusEl.textContent = "音乐播放中...";
                    statusEl.className = "status ready";
                }).catch(error => {
                    statusEl.textContent = "播放失败: " + error.message;
                    statusEl.className = "status error";
                });
            } else {
                music.pause();
                isPlaying = false;
                playIcon.textContent = "▶️";
                playText.textContent = "播放音乐";
                albumArt.classList.remove('playing');
                statusEl.textContent = "音乐已暂停";
                statusEl.className = "status";
            }
        }
        
        // 重新开始播放
        function restartMusic() {
            music.currentTime = 0;
            if (isPlaying) {
                music.play();
            }
        }
        
        // 点击进度条跳转
        progressBar.addEventListener('click', function(e) {
            if (!music.duration) return;
            
            const rect = this.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const percent = clickX / rect.width;
            music.currentTime = percent * music.duration;
            
            if (!userInteracted) {
                userInteracted = true;
                statusEl.className = "status ready";
                togglePlay(); // 自动开始播放
            }
        });
        
        // 初始化播放器
        function initPlayer() {
            // 设置初始状态
            statusEl.textContent = "等待用户点击页面以启动音乐...";
            statusEl.className = "status waiting";
            
            // 设置初始音量
            updateVolume(volumeSlider.value);
            
            // 监听音乐加载完成
            music.addEventListener('loadeddata', function() {
                statusEl.textContent = "音乐加载完成！点击页面任意位置开始播放";
                statusEl.className = "status ready";
            });
            
            // 监听播放进度
            music.addEventListener('timeupdate', updateProgress);
            
            // 监听播放结束（循环）
            music.addEventListener('ended', function() {
                if (isPlaying) {
                    music.currentTime = 0;
                    music.play();
                }
            });
            
            // 监听错误
            music.addEventListener('error', function() {
                statusEl.textContent = "错误：无法加载音乐文件。请检查文件名是否正确！";
                statusEl.className = "status error";
                
                // 提供可能的解决方案
                setTimeout(() => {
                    statusEl.innerHTML += "<br><small>请确保音乐文件已上传且文件名正确</small>";
                }, 1000);
            });
            
            // 页面点击事件（GitHub Pages需要用户交互）
            document.body.addEventListener('click', function initOnClick() {
                if (!userInteracted) {
                    userInteracted = true;
                    statusEl.textContent = "检测到点击，正在启动音乐播放...";
                    
                    // 尝试自动播放
                    setTimeout(() => {
                        togglePlay();
                    }, 500);
                    
                    // 移除监听器，只执行一次
                    document.body.removeEventListener('click', initOnClick);
                }
            });
            
            // 触摸事件（移动设备）
            document.body.addEventListener('touchstart', function initOnTouch() {
                if (!userInteracted) {
                    userInteracted = true;
                    statusEl.textContent = "检测到触摸，正在启动音乐播放...";
                    
                    setTimeout(() => {
                        togglePlay();
                    }, 500);
                    
                    document.body.removeEventListener('touchstart', initOnTouch);
                }
            });
            
            // 键盘事件
            document.addEventListener('keydown', function initOnKeyPress(e) {
                if (!userInteracted && e.code === 'Space') {
                    userInteracted = true;
                    statusEl.textContent = "检测到空格键，正在启动音乐播放...";
                    
                    setTimeout(() => {
                        togglePlay();
                    }, 500);
                    
                    document.removeEventListener('keydown', initOnKeyPress);
                }
            });
        }
        
        // 页面加载完成后初始化
        window.addEventListener('DOMContentLoaded', initPlayer);
        
        // 防止页面滚动时暂停
        window.addEventListener('beforeunload', function() {
            if (isPlaying) {
                // 可选：保存播放状态
                localStorage.setItem('musicPlaybackTime', music.currentTime);
            }
        });
    </script>
</body>
</html>
